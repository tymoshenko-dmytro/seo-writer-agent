{#- One settings field as a panel row: its label, the "changed" chip, its help, the control. -#}
{% macro field(f, current, overridden) -%}
<div class="panel-row">
  <div>
    <label class="label" for="{{ f.key }}">{{ f.label }}{% if f.key in overridden %} {{ ui.status("changed", "green") }}{% endif %}</label>
    {% if f.help %}<span class="hint">{{ f.help }}</span>{% endif %}
  </div>
  <div class="field-control">
  {% if f.type == "choice" %}
    <select class="select" name="{{ f.key }}" id="{{ f.key }}">
      {% for value, name in f.choices %}<option value="{{ value }}" {{ 'selected' if current[f.key] == value }}>{{ name }}</option>{% endfor %}
    </select>
  {% else %}
    <input class="input" type="number" name="{{ f.key }}" id="{{ f.key }}" value="{{ current[f.key] }}"
           min="{{ f.min }}" max="{{ f.max }}" step="{{ f.step | default('1') }}">
    <span class="hint">default {{ f.default }}, {{ f.min }}–{{ f.max }}</span>
  {% endif %}
  </div>
</div>
{%- endmacro %}
